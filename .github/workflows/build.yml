name: Build

# - Every push to main and every pull request: builds Ordock.app (Apple Silicon + Intel).
#   The download appears under "Artifacts" at the bottom of the run page (Actions tab).
# - Push to main with a new version in Sources/Info.plist: creates the release vX.Y.Z with
#   Ordock.dmg and Ordock.zip attached (the README download button always points to the latest one).
# - Run it by hand (Actions > Build > Run workflow) with "Replace the release" ticked to rebuild
#   the release of the current version from scratch, with the same version number.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      replace_release:
        description: "Replace the release of the current version with a fresh build"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (Apple Silicon + Intel)
        run: |
          mkdir -p build
          for arch in arm64 x86_64; do
            xcrun swiftc -O -swift-version 5 -parse-as-library \
              -target "$arch-apple-macos13.0" \
              Sources/main.swift \
              -framework AppKit -framework SwiftUI -framework Carbon -framework CoreServices -framework ServiceManagement \
              -o "build/Ordock-$arch"
          done
      - name: Create Ordock.app
        run: |
          APP=dist/Ordock.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # One binary that runs on both Apple Silicon and Intel Macs
          lipo -create -output "$APP/Contents/MacOS/Ordock" build/Ordock-arm64 build/Ordock-x86_64
          cp Sources/Info.plist "$APP/Contents/Info.plist"
          cp Sources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          # Ad-hoc signature (no Apple Developer account needed)
          codesign --force --deep --sign - "$APP"
          cd dist
          # Fixed name, so the README link .../releases/latest/download/Ordock.zip always works
          ditto -c -k --keepParent Ordock.app Ordock.zip
      - name: Create Ordock.dmg
        run: |
          # The classic install window: the app on the left, an arrow, the Applications folder on the right
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild
          tiffutil -cathidpicheck assets/dmg/background.png assets/dmg/background@2x.png -out dist/dmg-background.tiff
          cat > dist/dmg-settings.py <<'EOF'
          files = ["dist/Ordock.app"]
          symlinks = {"Applications": "/Applications"}
          icon = "Sources/AppIcon.icns"
          background = "dist/dmg-background.tiff"
          window_rect = ((200, 160), (640, 400))
          default_view = "icon-view"
          show_status_bar = False
          show_tab_view = False
          show_toolbar = False
          show_pathbar = False
          show_sidebar = False
          icon_size = 128
          text_size = 13
          icon_locations = {"Ordock.app": (160, 190), "Applications": (480, 190)}
          hide_extension = ["Ordock.app"]
          format = "UDZO"
          EOF
          "$RUNNER_TEMP/dmg/bin/dmgbuild" -s dist/dmg-settings.py "Ordock" dist/Ordock.dmg
          hdiutil verify dist/Ordock.dmg
      - name: Preview (welcome guide and installer window)
        continue-on-error: true
        run: |
          mkdir -p preview
          dist/Ordock.app/Contents/MacOS/Ordock --render-welcome "$PWD/preview"
          hdiutil attach dist/Ordock.dmg -nobrowse -noautoopen
          open /Volumes/Ordock
          sleep 4
          screencapture -x preview/dmg-window.png || true
          hdiutil detach /Volumes/Ordock -force || true
          ls -la preview
          for f in preview/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 60 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== BEGIN ${f%.png}.jpg"
            base64 -i "${f%.png}.jpg" | tr -d '\n'
            echo
            echo "=== END"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Ordock
          path: |
            dist/Ordock.zip
            dist/Ordock.dmg

  release:
    needs: macos
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        id: v
        run: |
          VERSION=$(grep -A0 'CFBundleShortVersionString' Sources/Info.plist | sed -E 's/.*<string>([^<]+)<\/string>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.replace_release }}" = "true" ]; then
            echo "Replacing release v$VERSION with this build."
            gh release delete "v$VERSION" --cleanup-tag --yes
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists: nothing to publish."
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          name: Ordock
          path: dist
      - name: Release notes
        if: steps.v.outputs.new == 'true'
        run: |
          VERSION=${{ steps.v.outputs.version }}
          # The section of CHANGELOG.md for this version, then the download instructions
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Download
          **Ordock.dmg** (or **Ordock.zip**) · macOS 13 Ventura or later, Apple Silicon and Intel

          ### Install
          1. Open **Ordock.dmg** and drag **Ordock** onto the **Applications** folder.
          2. The first time, right-click **Ordock** in Applications and choose **Open**
             (on recent macOS: System Settings › Privacy & Security › **Open Anyway**).
          3. A short welcome guide explains everything. Look for the penguin in the menu bar, next to the clock.

          Upgrading from **Riordina Dock**? Delete the old app from Applications: Ordock picks up its backups automatically.

          📖 Full guide and examples: [README](https://github.com/${{ github.repository }}#readme) · 🇮🇹 [Guida in italiano](https://github.com/${{ github.repository }}/blob/main/README.it.md)

          ❤️ Like Ordock? [Buy me a coffee](https://paypal.me/mattdanieli) · Made With Love ❤️ by MattDanieli
          NOTES
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Ordock ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/Ordock.dmg
            dist/Ordock.zip
